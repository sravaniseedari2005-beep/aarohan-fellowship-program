<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students in Action Gallery</title>
    <link rel="stylesheet" href="gallery-pages.css">
</head>
<body>
    <div class="gallery-page-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="Events.html">
                    <span class="brand-mark">✦</span>
                    <span class="brand-text">
                        <strong>AAROHAN</strong>
                        <small>ITDA Paderu</small>
                    </span>

                <nav class="page-links">
                    <a href="Events.html">Events</a>
                    <a href="Events.html#gallery">Gallery</a>

        </header>

        <main class="gallery-page">
            <div class="page-header">

            <div class="gallery-actions">
                <a class="primary-btn" href="Events.html#gallery">Back to Events</a>
