<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarohan Branch Campus Gallery</title>
    <link rel="stylesheet" href="gallery-pages.css">
</head>
<body>
    <div class="gallery-page-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="Events.html">
                    <span class="brand-mark">✦</span>
                    <span class="brand-text">
                        <strong>AAROHAN</strong>
                        <small>ITDA Paderu</small>
                    </span>
                </a>
                <nav class="page-links">
                    <a href="Events.html">Events</a>
                    <a href="Events.html#gallery">Gallery</a>
                </nav>
            </div>
        </header>

        <main class="gallery-page">
            <div class="page-header">
                <span class="eyebrow">Branches</span>
                <h1>Aarohan Branch <span>Campus</span></h1>
                <p>Explore the campus environment, learning spaces, student life, and the welcoming feel of Aarohan branches.</p>
            </div>

            <section class="gallery-grid">
                <article class="photo-card card-campus-1"><span class="card-label">Campus Entrance</span></article>
                <article class="photo-card card-campus-2"><span class="card-label">Main Building</span></article>
                <article class="photo-card card-campus-3"><span class="card-label">Learning Space</span></article>
                <article class="photo-card card-campus-4"><span class="card-label">Student Life</span></article>
            </section>

            <div class="gallery-actions">
                <a class="primary-btn" href="Events.html#gallery">Back to Events</a>
                <a class="secondary-btn" href="Events.html">Home</a>
            </div>
        </main>
    </div>
</body>
</html>
