<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NITI Aayog Team Visit Gallery</title>
    <link rel="stylesheet" href="gallery-pages.css">
</head>
<body>
    <div class="gallery-page-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="Events.html">
                    <span class="brand-mark">✦</span>
                    <span class="brand-text">
                        <strong>AAROHAN</strong>
                        <small>ITDA Paderu</small>
                    </span>
                </a>
                <nav class="page-links">
                    <a href="Events.html">Events</a>
                    <a href="Events.html#gallery">Gallery</a>
                </nav>
            </div>
        </header>

        <main class="gallery-page">
            <div class="page-header">
                <span class="eyebrow">Visits</span>
                <h1>NITI Aayog Team <span>Visit</span></h1>
                <p>Special moments from the team visit, student interaction, and learning about innovation and development.</p>
            </div>

            <section class="gallery-grid">
                <article class="photo-card card-visit-1"><span class="card-label">Guest Arrival</span></article>
                <article class="photo-card card-visit-2"><span class="card-label">Student Interaction</span></article>
                <article class="photo-card card-visit-3"><span class="card-label">Discussion</span></article>
                <article class="photo-card card-visit-4"><span class="card-label">Inspiration</span></article>
            </section>

            <div class="gallery-actions">
                <a class="primary-btn" href="Events.html#gallery">Back to Events</a>
                <a class="secondary-btn" href="Events.html">Home</a>
            </div>
        </main>
    </div>
</body>
</html>
